- description: java-ddd-architecture:remote-repository-optional-boundary
  prompts:
  - apply-skill
  vars:
    skill: file://../java-ddd-architecture/SKILL.md
    task: Refactor a domain AccountRepository currently returning VendorAccountResponse from findAccountFromHttp.
      It retrieves accounts from a remote API. Missing accounts are ordinary absence, and existing Java
      callers use Optional<Account>. Show the contract and responsibility placement, not a complete HTTP
      client.
    project_instructions: AGENTS.md explicitly selects DDD. Domain owns Account and AccountId; infrastructure
      owns the vendor client.
    reference: file://../java-ddd-architecture/references/repository-boundaries.md
  assert:
  - type: llm-rubric
    value: Pass only if the domain contract returns Optional<Account> through findById or established
      Java naming, infrastructure maps vendor responses, domain models/contracts remain independent of
      transport, and technical errors are not swallowed as absence. Preserve Optional for ordinary absence
      rather than introducing a required NotFoundException, and do not require generic unused CRUD.
  metadata:
    id: java-ddd-architecture:remote-repository-optional-boundary
    skill: java-ddd-architecture
    kind: apply
- description: java-ddd-architecture:application-domain-service-split
  prompts:
  - apply-skill
  vars:
    skill: file://../java-ddd-architecture/SKILL.md
    project_instructions: AGENTS.md explicitly selects DDD and this collection's anemic-domain-model
      convention. ProductService is an application service. ProductPricingService is a domain service.
    task: ProductService.readPrice loads a Product, calculates discounted pricing inline, and returns
      ResponseEntity<Product>. ProductPricingService currently accepts ProductPriceRequest and Authentication.
      Show how these responsibilities and contracts must change, with good and bad Java examples.
      Keep existing service names; no new domain pricing rules are requested.
    reference: file://../java-ddd-architecture/references/service-boundaries.md
  assert:
  - type: llm-rubric
    value: Pass only if ProductService coordinates repository retrieval, ProductPricingService and output
      DTO construction; ProductPricingService implements pricing using domain models/value objects and
      returns a domain result. Keep request DTOs, Authentication, ResponseEntity and vendor clients out of
      the domain service. Preserve the anemic-model policy and existing service names. Keep transaction
      orchestration in the application service and HTTP mapping at the web boundary. Include good and bad
      Java examples without inventing pricing policy or a mandatory domain service for every CRUD operation.
  metadata:
    id: java-ddd-architecture:application-domain-service-split
    skill: java-ddd-architecture
    kind: apply
- description: java-ddd-architecture:activation-guard
  prompts:
  - apply-skill
  vars:
    skill: file://../java-ddd-architecture/SKILL.md
    task: Reorganize this small Java application using your architecture skill. It has Controller, Service,
      Repository packages and no declared architectural style.
    project_instructions: AGENTS.md says Java 21 and Spring Boot. It does not state DDD or Domain-Driven
      Design.
  assert:
  - type: llm-rubric
    value: Pass only if the DDD skill stays inactive because the instructions do not explicitly select
      DDD, without imposing a domain/infrastructure relocation.
  metadata:
    id: java-ddd-architecture:activation-guard
    skill: java-ddd-architecture
    kind: apply
